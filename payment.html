<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Frosty Delights</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#fff5f8,#ffeef0);
    margin: 0;
    padding: 0;
    color: #333;
  }
  .payment-container {
    max-width: 500px;
    margin: 80px auto;
    background: #fff;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(255,128,160,0.2);
    text-align: center;
  }
  h1 {
    color: #ff4081;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 20px 0;
    padding: 10px 15px;
    border: 2px solid #ffd6e0;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
  }
  .option:hover {
    border-color: #ff7b89;
    background: #fff0f5;
  }
  input[type="radio"] {
    transform: scale(1.5);
    cursor: pointer;
  }
  label {
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .confirm-btn {
    margin-top: 30px;
    background: linear-gradient(90deg,#ff8fab,#ffb6c1);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    transition: 0.3s;
  }
  .confirm-btn:hover {
    background: linear-gradient(90deg,#ffb6c1,#ff8fab);
  }
</style>
</head>
<body>

<div class="payment-container">
  <h1>💳 Choose Payment Method</h1>

  <div class="option">
    <input type="radio" id="online" name="payment" value="Online">
    <label for="online">Online Payment</label>
  </div>

  <div class="option">
    <input type="radio" id="cod" name="payment" value="Cash on Delivery">
    <label for="cod">Cash on Delivery (COD)</label>
  </div>

  <button class="confirm-btn" onclick="confirmPayment()">Confirm Payment</button>
</div>

<script>
function confirmPayment() {
  const payment = document.querySelector('input[name="payment"]:checked');
  if (!payment) {
    alert("⚠️ Please select a payment method!");
    return;
  }

  // Save payment method
  localStorage.setItem("paymentMethod", payment.value);

  // Confirmation popup
  if(confirm(`✅ You chose ${payment.value} as payment method. Click OK to view your bill.`)) {
    window.location.href = "bill.html";
  }
}
</script>

</body>
</html>
