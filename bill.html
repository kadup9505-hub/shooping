<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill - Frosty Delights</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#ffe6f0,#fff0f5);
    margin: 0;
    padding: 0;
    color: #333;
  }

  .bill-container {
    max-width: 950px;
    margin: 50px auto;
    background: #fff;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(255,128,160,0.3);
    transition: 0.3s;
  }

  .bill-container:hover {
    box-shadow: 0 20px 40px rgba(255,128,160,0.4);
  }

  h1 {
    text-align: center;
    color: #ff2e7a;
    font-size: 2rem;
    margin-bottom: 30px;
    text-shadow: 1px 1px 2px #ffd1e3;
  }

  .section-title {
    font-size: 1.5rem;
    color: #ff2e7a;
    border-bottom: 3px solid #ffccd9;
    padding-bottom: 5px;
    margin-bottom: 20px;
  }

  .address-box {
    background: linear-gradient(90deg,#ffe6f2,#fff0f5);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid #ffcce0;
    margin-bottom: 30px;
    line-height: 1.6;
    font-weight: 500;
    color: #ff2e7a;
  }

  .bill-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff0f5;
    border-radius: 15px;
    padding: 15px 20px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(255,128,160,0.2);
    transition: 0.3s;
  }

  .bill-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255,128,160,0.3);
  }

  .bill-item img {
    width: 90px;
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    border: 2px solid #ff99b3;
  }

  .item-details {
    flex: 1;
    margin-left: 20px;
  }

  .item-details h3 {
    margin: 0;
    color: #ff2e7a;
    font-size: 1.2rem;
  }

  .item-details p {
    margin: 5px 0;
    font-size: 0.95rem;
    color: #555;
  }

  .item-total {
    font-weight: 600;
    font-size: 1.1rem;
    color: #ff2e7a;
  }

  .total, .payment-method {
    text-align: right;
    font-size: 1.4rem;
    color: #222;
    margin-top: 25px;
    font-weight: 700;
  }

  .button-group {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 14px 30px;
    border-radius: 15px;
    font-weight: 600;
    font-size: 1.1rem;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg,#ff6699,#ff99cc);
    color: white;
    text-decoration: none;
    transition: 0.4s;
    box-shadow: 0 5px 15px rgba(255,128,160,0.3);
  }

  .action-btn:hover {
    background: linear-gradient(90deg,#ff99cc,#ff6699);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,128,160,0.4);
  }

  .cancel-btn {
    padding: 14px 30px;
    border-radius: 15px;
    font-weight: 600;
    font-size: 1.1rem;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg,#ff4d4d,#ff8080);
    color: white;
    transition: 0.4s;
    box-shadow: 0 5px 15px rgba(255,77,77,0.3);
  }

  .cancel-btn:hover {
    background: linear-gradient(90deg,#ff8080,#ff4d4d);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,77,77,0.4);
  }

  /* Print view: hide buttons */
  @media print {
    .button-group {
      display: none;
    }
    body {
      background: #fff;
    }
    .bill-container {
      box-shadow: none;
      border-radius: 0;
      margin: 0;
      padding: 20px;
    }
  }
</style>
</head>
<body>

<div class="bill-container">
  <h1>🧾 Your Bill</h1>

  <!-- Delivery Address -->
  <div class="section-title">Delivery Address</div>
  <div class="address-box" id="addressBox">Loading address...</div>

  <!-- Ordered Items -->
  <div class="section-title">Ordered Items</div>
  <div id="billItems"></div>

  <!-- Total & Payment -->
  <div class="total" id="billTotal"></div>
  <div class="payment-method" id="paymentMethod"></div>

  <!-- Buttons -->
  <div class="button-group">
    <button class="action-btn" onclick="window.print()">🖨️ Print Bill</button>
    <a href="index.html" class="action-btn">⬅ Back to Home</a>
    <button class="cancel-btn" onclick="cancelOrder()">❌ Cancel Order</button>
  </div>
</div>

<script>
  const billContainer = document.getElementById("billItems");
  const totalDisplay = document.getElementById("billTotal");
  const paymentDisplay = document.getElementById("paymentMethod");
  const addressBox = document.getElementById("addressBox");

  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const paymentMethod = localStorage.getItem("paymentMethod") || "Not selected";
  const addressData = JSON.parse(localStorage.getItem("address"));

  // Display Address
  if(addressData) {
    addressBox.innerHTML = `
      <strong>${addressData.name}</strong><br>
      📞 ${addressData.phone}<br>
      🏡 ${addressData.address}, ${addressData.city} - ${addressData.pincode}
    `;
  } else {
    addressBox.innerHTML = "<p>No address found.</p>";
  }

  // Display Cart Items
  let total = 0;
  if(cart.length === 0) {
    billContainer.innerHTML = "<p style='text-align:center; padding:20px; color:#ff4081;'>Your cart is empty 🍦</p>";
  } else {
    cart.forEach(item => {
      const quantity = item.quantity || 1;
      const itemTotal = item.price * quantity;
      total += itemTotal;

      const div = document.createElement("div");
      div.className = "bill-item";
      div.innerHTML = `
        <img src="${item.image}" alt="${item.name}">
        <div class="item-details">
          <h3>${item.name}</h3>
          <p>₹${item.price} × ${quantity}</p>
        </div>
        <div class="item-total">₹${itemTotal}</div>
      `;
      billContainer.appendChild(div);
    });
  }

  totalDisplay.textContent = "Total: ₹" + total;
  paymentDisplay.textContent = "Payment Method: " + (paymentMethod === "Online" ? "💳 Online Payment" : "📦 Cash on Delivery");

  // Cancel Order: immediately redirect to home
  function cancelOrder() {
    localStorage.removeItem("cart");
    localStorage.removeItem("paymentMethod");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
