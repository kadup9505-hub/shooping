<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Address - Frosty Delights</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffeef0, #fff5f8);
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 600px;
    background: #fff;
    margin: 60px auto;
    padding: 30px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(255, 128, 160, 0.25);
  }

  h1 {
    text-align: center;
    color: #ff4081;
    margin-bottom: 25px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  input, textarea {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ffb6c1;
    outline: none;
    font-size: 1rem;
  }

  input:focus, textarea:focus {
    border-color: #ff4081;
    box-shadow: 0 0 6px rgba(255, 64, 129, 0.3);
  }

  textarea {
    resize: none;
    height: 80px;
  }

  .btn {
    margin-top: 15px;
    background: linear-gradient(90deg, #ff8fab, #ffb6c1);
    border: none;
    padding: 12px;
    color: white;
    font-weight: 600;
    border-radius: 25px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    background: linear-gradient(90deg, #ffb6c1, #ff8fab);
  }
</style>
</head>
<body>

<div class="container">
  <h1>🏡 Delivery Address</h1>
  <form id="addressForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="text" id="phone" placeholder="Mobile Number" required>
    <textarea id="address" placeholder="Complete Address" required></textarea>
    <input type="text" id="city" placeholder="City" required>
    <input type="text" id="pincode" placeholder="Pincode" required>
    <button type="submit" class="btn">Confirm & Continue</button>
  </form>
</div>

<script>
  document.getElementById("addressForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const addressData = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      city: document.getElementById("city").value,
      pincode: document.getElementById("pincode").value
    };

    localStorage.setItem("address", JSON.stringify(addressData));

    alert("Address saved successfully!");
    window.location.href = "order-confirm.html";
  });
</script>

</body>
</html>
