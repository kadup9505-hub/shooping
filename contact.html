<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Frosty Delights</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #fce3ec, #fff4d9);
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background-color: #ff6fa1;
      color: white;
      text-align: center;
      padding: 1.5rem 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .contact-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      gap: 30px;
    }

    .contact-info, .contact-form {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      padding: 30px;
      width: 100%;
      max-width: 500px;
    }

    .contact-info h2, .contact-form h2 {
      color: #ff6fa1;
      margin-bottom: 15px;
    }

    .info-item {
      margin: 10px 0;
    }

    .info-item strong {
      color: #ff6fa1;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }

    .contact-form input:focus, .contact-form textarea:focus {
      border-color: #ff6fa1;
    }

    .contact-form button {
      background-color: #ff6fa1;
      border: none;
      color: white;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .contact-form button:hover {
      background-color: #ff4e87;
    }

    .map-container {
      width: 100%;
      margin: 40px auto;
      max-width: 1000px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      height: 350px;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: #ff6fa1;
      color: white;
      margin-top: 30px;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .contact-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    🍨 Contact Frosty Delights 🍧
  </header>

  <section class="contact-container">
    <div class="contact-info">
      <h2>Get in Touch</h2>
      <p class="info-item"><strong>📍 Address:</strong> 123 Sweet Street, Dessert City</p>
      <p class="info-item"><strong>📞 Phone:</strong> +91 98765 43210</p>
      <p class="info-item"><strong>📧 Email:</strong> info@frostydelights.com</p>
      <p class="info-item"><strong>🕒 Hours:</strong> Mon - Sun: 10:00 AM - 10:00 PM</p>
    </div>

    <div class="contact-form">
      <h2>Send Us a Message</h2>
      <form onsubmit="sendMessage(event)">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="email" id="email" placeholder="Your Email" required />
        <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <div class="map-container">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.2918962031366!2d144.95605401531543!3d-37.817209979751834!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d43c2b1a7c3%3A0x2b2df71c229d8b69!2sIce%20Cream%20Shop!5e0!3m2!1sen!2sin!4v1615432057160!5m2!1sen!2sin"
      allowfullscreen=""
      loading="lazy"></iframe>
  </div>

  <footer>
    © 2025 Frosty Delights | Made with ❤️ and Ice Cream
  </footer>

  <script>
    function sendMessage(e) {
      e.preventDefault();
      alert("Thank you! Your message has been sent 🍦");
      e.target.reset();
    }
  </script>

</body>
</html>
